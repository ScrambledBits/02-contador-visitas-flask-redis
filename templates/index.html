<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contador de visitas</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 3rem auto; padding: 0 1rem; text-align: center; }
    .total { font-size: 5rem; font-weight: bold; margin: 1rem 0; }
    code { background: #f2f2f2; padding: .1rem .3rem; border-radius: 4px; }
    table { margin: 1.5rem auto; border-collapse: collapse; }
    td, th { padding: .3rem .8rem; border-bottom: 1px solid #ddd; }
  </style>
</head>
<body>
  <h1>{{ mensaje }}</h1>
  <p>Esta página ha sido visitada</p>
  <div class="total">{{ total }}</div>
  <p>veces. Te atendió el contenedor <code>{{ host }}</code>.</p>

  <h2>Visitas por contenedor</h2>
  <table>
    <tr><th>Contenedor</th><th>Visitas</th></tr>
    {% for nombre, cantidad in por_host.items() %}
    <tr><td><code>{{ nombre }}</code></td><td>{{ cantidad }}</td></tr>
    {% endfor %}
  </table>
  <p><small>Recarga la página para sumar una visita.</small></p>
</body>
</html>
